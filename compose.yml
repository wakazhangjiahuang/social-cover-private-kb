services:
  social-cover-studio:
    build: .
    container_name: social-cover-studio
    restart: unless-stopped
    ports:
      - "${STUDIO_PORT:-29012}:29012"
    env_file:
      - .env
    environment:
      STUDIO_HOST: 0.0.0.0
      STUDIO_ACCESS_TOKEN: "${STUDIO_ACCESS_TOKEN:?请在.env中设置至少16位访问密码}"
      STUDIO_DATA_DIR: /data
    volumes:
      - studio-data:/data
volumes:
  studio-data:
